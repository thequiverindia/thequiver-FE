name: CI

on:
  push:
    branches: [main, phase-2-foundation]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PAYLOAD_SECRET: ci-only-secret
      DATABASE_URI: file:./ci.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
